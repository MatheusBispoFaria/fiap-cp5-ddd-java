spring.application.name=fiap-bank-core-bancario

# Porta do Core Bancario
server.port=8081

# Banco H2 em memoria
spring.datasource.url=jdbc:h2:mem:corebancario;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracao JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Integracao com o Core Bancario
core.bancario.url=http://localhost:8081/api/v1