server:
  port: 8080

spring:
  cloud:
    openfeign:
      client:
        config:
          coreBancarioClient:
            connectTimeout: 2000
            readTimeout: 3000
  application:
    name: fiap-bank-plataforma-credito
  datasource:
    url: jdbc:h2:mem:plataformacreditodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

core:
  bancario:
    url: ${CORE_BANCARIO_URL:http://localhost:8081/api/v1}
